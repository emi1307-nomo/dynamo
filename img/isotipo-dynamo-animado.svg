    @keyframes dya-encender { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dya-anillo, .dya-fig, .dya-cabeza, .dya-brillo, .dya-brillo-luz { animation: none; } .dya-brillo-luz { opacity: 0; } }
